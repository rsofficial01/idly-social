# Official image lane, step 3: publish every item in queue/approved/ that still passes the gate (the lower of the
# self and blind reviewer scores >= 12/14) and is fresh (under 8 hours old unless evergreen). One post per
# account per run. Tokens come only from GitHub secrets, are never printed, and a missing one skips that account.
name: lane-publish

on:
  schedule:
    - cron: "5-59/10 * * * *"     # 5 minutes after lane-render's runs
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["queue/approved/**"]

permissions:
  contents: write

concurrency:
  group: idly-lane-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Anything approved?
        id: work
        run: |
          if ls queue/approved/*.json >/dev/null 2>&1 || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "queue/approved is empty: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.work.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.work.outputs.run == 'true'
        run: python -m pip install requests Pillow jsonschema

      - name: Publish approved posts
        if: steps.work.outputs.run == 'true'
        env:
          IG_TOKEN_IDLYNEWS: ${{ secrets.IG_TOKEN_IDLYNEWS }}
          IG_TOKEN_IDLYTECH: ${{ secrets.IG_TOKEN_IDLYTECH }}
          IG_TOKEN_IDLYHYPE: ${{ secrets.IG_TOKEN_IDLYHYPE }}
          IG_TOKEN_IDLYAUTOMOTIVE: ${{ secrets.IG_TOKEN_IDLYAUTOMOTIVE }}
          IG_TOKEN_IDLYNERD: ${{ secrets.IG_TOKEN_IDLYNERD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for a in IDLYNEWS IDLYTECH IDLYHYPE IDLYAUTOMOTIVE IDLYNERD; do
            v="IG_TOKEN_$a"
            if [ -n "${!v}" ]; then echo "IG_TOKEN_$a: set"; else echo "IG_TOKEN_$a: NOT SET (that account is skipped)"; fi
          done
          # GitHub's 10-minute schedule is unreliable, so one run drains the queue: it publishes what it can,
          # then re-checks every 5 minutes (new approvals, and accounts whose 30-minute gap has passed) until
          # queue/approved is empty, for at most about 2 hours.
          for i in $(seq 1 26); do
            git pull --rebase -q || true
            python pipeline/lane.py publish-approved --push
            ls queue/approved/*.json >/dev/null 2>&1 || break
            sleep 300
          done
